[project]
name = "osier-core"
version = "0.1.0"
description = "Headless, agent-native, metadata-driven business platform engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "mcp>=1.12",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
]

[project.scripts]
osier = "osier.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
