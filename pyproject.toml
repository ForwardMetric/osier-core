[project]
name = "osier-core"
version = "0.1.0"
description = "Headless, agent-native, metadata-driven business platform engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "common-expression-language>=0.10,<0.11",
    "croniter>=6.2,<7",
    "cryptography>=43",
    "jinja2>=3.1,<4",
    "jsonschema>=4.23",
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-postgres>=3.2,<3.3",
    "mcp>=2.3,<3",
    "openai>=3.46,<4",
    "procrastinate>=3.10,<3.11",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "python-multipart>=0.0.33",
    "pyyaml>=6",
    "starlette>=1.10,<2",
    "uvicorn>=0.54,<1",
]

[project.scripts]
osier = "osier.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
