<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}osier{% endblock %}</title>
<link rel="stylesheet" href="/static/portal.css?v={{ css_version }}">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">osier</div>
    <nav>
      {% for item in nav %}
      <a href="{{ item.path }}" class="{{ 'active' if (current == item.path or (item.path != '/' and current.startswith(item.path))) else '' }}">{{ item.label }}</a>
      {% endfor %}
    </nav>
    <div class="who">
      <div class="name">{{ who.name }}</div>
      <div class="muted small">{{ who.email }}</div>
      <div class="muted small">{{ who.roles | join(', ') or 'no roles' }}</div>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="link" type="submit">Sign out</button>
      </form>
    </div>
  </aside>
  <main class="main">
    {% for kind, message in flashes %}
    <div class="flash {{ kind }}" role="status">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
